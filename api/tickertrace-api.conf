<VirtualHost *:80>
    ServerName api.tickertrace.mphinance.com

    # Redirect all HTTP to HTTPS (if SSL is set up)
    # RewriteEngine On
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    # Proxy to uvicorn
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8100/
    ProxyPassReverse / http://127.0.0.1:8100/

    # WebSocket support (for MCP if needed)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8100/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/tickertrace-api-error.log
    CustomLog ${APACHE_LOG_DIR}/tickertrace-api-access.log combined
</VirtualHost>
