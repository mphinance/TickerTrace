name: Daily ETF Holdings Scrape

on:
  schedule:
    # Run at 23:00 UTC (6:00 PM EST) every weekday (Monday-Friday)
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        run: python scrape_avantis.py

      - name: Sync CSV to Dashboard
        run: cp normalized_holdings.csv etf-dashboard/public/

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdings.db scraper.log normalized_holdings.csv etf-dashboard/public/normalized_holdings.csv
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily holdings update [skip ci]" && git push)
