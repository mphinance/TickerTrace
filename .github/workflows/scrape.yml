name: Daily ETF Holdings Scrape

on:
  schedule:
    # Run at 12:00 UTC (7:00 AM EST) every weekday (Monday-Friday)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        run: python scrape_avantis.py

      - name: Sync CSV to Dashboard & Archive History
        run: |
          mkdir -p etf-dashboard/public/data/history
          # Copy to latest
          cp normalized_holdings.csv etf-dashboard/public/data/holdings_latest.csv
          # Create dated snapshot
          TODAY=$(date +%Y-%m-%d)
          cp normalized_holdings.csv etf-dashboard/public/data/history/holdings_${TODAY}.csv
          # Keep only last 30 days of history
          find etf-dashboard/public/data/history -name "holdings_*.csv" -type f -mtime +30 -delete

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdings.db scraper.log normalized_holdings.csv etf-dashboard/public/data/
          # Only commit if there are changes
          TODAY=$(date +%Y-%m-%d)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update holdings [${TODAY}]" && git push)
