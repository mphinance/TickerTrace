name: Daily ETF Holdings Scrape

on:
  schedule:
    # Run at 12:00 UTC (7:00 AM EST) every weekday (Monday-Friday)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        run: python scrape_avantis.py

      # Standalone CBOE option-universe diff — no holdings data, stdlib only.
      # Writes cboe_snapshot.json + cboe_history/*.json under public/data/,
      # which the commit step below picks up.
      - name: Run CBOE Options Scanner
        run: python cboe_scanner.py

      - name: Sync CSV to Dashboard & Archive History
        run: |
          mkdir -p etf-dashboard/public/data/history
          # Copy to latest
          cp normalized_holdings.csv etf-dashboard/public/data/holdings_latest.csv
          # Create dated snapshot
          TODAY=$(date +%Y-%m-%d)
          cp normalized_holdings.csv etf-dashboard/public/data/history/holdings_${TODAY}.csv
          # Keep only last 30 days of history
          find etf-dashboard/public/data/history -name "holdings_*.csv" -type f -mtime +30 -delete

      # Persist the yfinance price cache between runs so we only fetch the new
      # day's incremental prices instead of redoing the full 1,600-ticker pull
      # every morning. The aggregate output JSON is committed separately.
      - name: Restore yfinance price cache
        id: cache-prices
        uses: actions/cache@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}
          restore-keys: |
            signal-perf-prices-v1-

      - name: Refresh signal-vs-price backtest
        run: |
          mkdir -p data
          python -m api.signal_performance 30

      - name: Save yfinance price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Commit CSVs + the refreshed signal-performance JSON. The yfinance
          # price cache is gitignored — it persists via the actions cache above.
          git add normalized_holdings.csv etf-dashboard/public/data/
          TODAY=$(date +%Y-%m-%d)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update holdings [${TODAY}]" && git push)
